<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Dark Gradient Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="340" fill="url(#bgGradient)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1200" height="340" fill="url(#grid)" />
  </g>

  <!-- Background Dynamic Network Nodes & Flow Lines (Lower Opacity in Background) -->
  <g opacity="0.25">
    <!-- Pulse Line 1 -->
    <path d="M -50 220 Q 200 120 450 250 T 900 180 T 1250 280" fill="none" stroke="url(#accentGlow)" stroke-width="3">
      <animate attributeName="stroke-dasharray" values="0,1000;1000,0;0,1000" dur="8s" repeatCount="indefinite" />
    </path>
    
    <!-- Pulse Line 2 -->
    <path d="M -50 80 Q 350 280 700 100 T 1250 150" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 6">
      <animate transform="rotate(360 600 170)" attributeName="stroke-dashoffset" values="0;100" dur="12s" repeatCount="indefinite" />
    </path>

    <!-- Floating Node Orbs -->
    <circle cx="150" cy="90" r="4" fill="#00DFD8" filter="url(#glow)">
      <animate attributeName="cy" values="90;75;90" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="250" r="5" fill="#FF0080" filter="url(#glow)">
      <animate attributeName="cy" values="250;265;250" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="850" cy="80" r="3.5" fill="#7928CA" filter="url(#glow)">
      <animate attributeName="cx" values="850;865;850" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Top Glow Line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGlow)" />

  <!-- Foreground Content Group (High Contrast & Clear Readability) -->
  <g filter="url(#softShadow)">
    <!-- Main Badge Pill -->
    <g transform="translate(60, 48)">
      <rect width="260" height="32" rx="16" fill="#1f242d" stroke="#30363d" stroke-width="1.5" />
      <circle cx="18" cy="16" r="6" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="34" y="21" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="142" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Affiliate Management Platform 🚀
    </text>

    <!-- Subtitle / Description -->
    <text x="60" y="192" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400">
      Curated index of SaaS platforms &amp; open-source projects for referral tracking &amp; payouts.
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(60, 235)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="16" y="23" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">📊 SaaS Comparison</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="195" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="16" y="23" fill="#bc8cff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">⭐ Open-Source Repos</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(405, 0)">
        <rect width="185" height="36" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
        <text x="16" y="23" fill="#3fb950" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">💰 Pricing &amp; Metrics</text>
      </g>
    </g>
  </g>
</svg>
